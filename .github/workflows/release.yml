name: Release

# Push a tag `vX.Y.Z` matching haxelib.json's version to publish it on lib.haxe.org.
# Running it by hand builds and packages without publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Install Haxe and libraries
        run: |
          npm ci
          npx lix download

      - name: Check the tag matches haxelib.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="$(node -p "require('./haxelib.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match haxelib.json version ${version}" >&2
            exit 1
          fi

      - name: Build converter.jar and run.n
        run: |
          npx haxe build.hxml
          npx haxe run.hxml

      - name: Convert the test workspace
        run: java -jar converter.jar tests/config.json

      - name: Package
        run: zip -r ax4.zip haxelib.json README.md LICENSE converter.jar run.n compat

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ax4
          path: ax4.zip

      - name: Submit to lib.haxe.org
        if: startsWith(github.ref, 'refs/tags/')
        env:
          HAXELIB_PASSWORD: ${{ secrets.HAXELIB_PASSWORD }}
        run: npx haxelib submit ax4.zip "$HAXELIB_PASSWORD" --always

      - name: Attach the package to a GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" ax4.zip --title "${GITHUB_REF_NAME}" --generate-notes
